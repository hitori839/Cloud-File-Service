services:
  cloud-file-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    expose:
      - "8080"
    networks:
      - cloud-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cloud-file-service
    networks:
      - cloud-network

networks:
  cloud-network:
    driver: bridge