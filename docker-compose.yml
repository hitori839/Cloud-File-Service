services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloud-file-service

    expose:
      - "8080"

    networks:
      - cloud-network


  nginx:
    image: nginx:alpine

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend

    networks:
      - cloud-network


networks:
  cloud-network:
    driver: bridge